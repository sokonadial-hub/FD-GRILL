name: Build and deploy

# Builds the React site on every pull request (so a broken build shows up before
# merging). On every push to main it refreshes the built copy of the site in
# site/ on main (the root .htaccess sends every visitor there, so Hostinger can
# serve main as-is) and publishes the same files to the `hostinger` branch.
# Neither site/ nor the hostinger branch should be edited by hand.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Update the built copy in site/ on main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          rm -rf site && cp -r dist site
          git add -A site
          if git diff --cached --quiet; then echo "site/ is already up to date"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Update the built site in site/ [skip ci]"
          git push origin HEAD:main
      - name: Publish to the hostinger branch
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: dist
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b hostinger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site build from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" hostinger
